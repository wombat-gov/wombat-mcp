[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wombat-mcp"
version = "0.2.0"
description = "Model Context Protocol bridge for WOMBATpass with OIDC pass-through auth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Artem Lajko" },
    { name = "Sascha Lewandowski" },
    { name = "Sebastian Meyer" },
    { name = "Tim Urlaub" },
]
keywords = [
    "wombat", "mcp", "model-context-protocol", "fastapi", "sse",
    "compliance", "security", "cloud", "devsecops", "governance",
    "wombatpass", "ai-assistant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "structlog>=24.4.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30.0",
    "respx>=0.22.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://www.wombat-gov.dev"
Documentation = "https://www.wombat-gov.dev/docs/"
Repository = "https://github.com/wombat-gov/wombat-mcp"
"Bug Tracker" = "https://github.com/wombat-gov/wombat-mcp/issues"
Community = "https://github.com/wombat-gov"

[project.scripts]
wombat-mcp = "wombat_mcp.main:main"
wombat-mcp-stdio = "wombat_mcp.stdio_server:_entrypoint"
wombat-mcp-configure = "wombat_mcp.configure:_entrypoint"
# Deprecated aliases kept for the WAFpass → WOMBATpass migration window.
wafpass-mcp = "wombat_mcp.main:legacy_main"
wafpass-mcp-stdio = "wombat_mcp.stdio_server:_legacy_entrypoint"
wafpass-mcp-configure = "wombat_mcp.configure:_legacy_entrypoint"

[tool.hatch.build.targets.wheel]
# Deprecated compatibility package; canonical import package is "wombat_mcp".
packages = ["wombat_mcp", "wafpass_mcp"]
include = ["wombat_mcp/static/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
